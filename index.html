<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalkulyator va Portal Menyu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #020617;
            color: #ffffff;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            gap: 30px;
        }

        /* --- 1. CHAPDAGI KALKULYATOR QISMI --- */
        #vaultContainer {
            background: #1e293b;
            padding: 20px;
            border-radius: 22px;
            border: 2px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 50;
            position: relative;
            flex-shrink: 0;
        }
        #calcScreen {
            width: 100%;
            height: 65px;
            background: #0f172a;
            border-radius: 12px;
            font-size: 28px;
            text-align: right;
            padding: 15px;
            color: #38bdf8;
            margin-bottom: 15px;
            border: 1px solid #334155;
            overflow: hidden;
            user-select: none;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
        }
        .calc-btn {
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            background: #334155;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
        }
        .calc-btn:hover { background: #475569; }
        .calc-btn:active { background: #64748b; transform: scale(0.95); }
        .calc-btn.op { background: #d97706; }
        .calc-btn.op:hover { background: #b45309; }
        .calc-btn.eq { background: #16a34a; grid-column: span 2; }
        .calc-btn.eq:hover { background: #15803d; }

        /* --- 2. O'NGDAGI MAXFIY PORTAL MENYU --- */
        #secretHub {
            display: none;
            background: #1e293b;
            padding: 24px;
            border-radius: 22px;
            border: 2px solid rgba(251, 191, 36, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            width: 450px;
            height: 480px;
            flex-direction: column;
            z-index: 50;
            position: relative;
            flex-shrink: 0;
        }

        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .portal-back-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.15s;
        }
        .portal-back-btn:hover { background: #475569; color: #facc15; }

        .hub-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .hub-card {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            padding: 16px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            width: 100%;
        }
        .hub-card:hover { border-color: #facc15; transform: translateY(-2px); background: #1e293b; }
        
        .hub-card.ninja-game {
            background: linear-gradient(135deg, #16a34a, #15803d);
            border-color: #4ade80;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- 1. CHAPDAGI KALKULYATOR QISMI -->
    <div id="vaultContainer">
        <h3 style="margin-top:0; color:#38bdf8; font-size:16px; margin-bottom:10px;">🧮 KALKULYATOR</h3>
        <div id="calcScreen">0</div>
        <div class="calc-grid">
            <button type="button" class="calc-btn" onclick="btnClick('7')">7</button>
            <button type="button" class="calc-btn" onclick="btnClick('8')">8</button>
            <button type="button" class="calc-btn" onclick="btnClick('9')">9</button>
            <button type="button" class="calc-btn op" onclick="btnClick('/')">/</button>
            
            <button type="button" class="calc-btn" onclick="btnClick('4')">4</button>
            <button type="button" class="calc-btn" onclick="btnClick('5')">5</button>
            <button type="button" class="calc-btn" onclick="btnClick('6')">6</button>
            <button type="button" class="calc-btn op" onclick="btnClick('*')">*</button>
            
            <button type="button" class="calc-btn" onclick="btnClick('1')">1</button>
            <button type="button" class="calc-btn" onclick="btnClick('2')">2</button>
            <button type="button" class="calc-btn" onclick="btnClick('3')">3</button>
            <button type="button" class="calc-btn op" onclick="btnClick('-')">-</button>
            
            <button type="button" class="calc-btn" onclick="btnClick('C')">C</button>
            <button type="button" class="calc-btn" onclick="btnClick('0')">0</button>
            <button type="button" class="calc-btn op" onclick="btnClick('+')">+</button>
            <button type="button" class="calc-btn eq" onclick="btnClick('=')">=</button>
        </div>
        <p style="font-size:11px; color:#64748b; margin-top:10px; text-align:center;">Parol: <b>820</b> ni terib <b>=</b> bosing</p>
    </div>

    <!-- 2. O'NGDAGI MAXFIY PORTAL MENYU -->
    <div id="secretHub">
        <div class="portal-header">
            <button type="button" class="portal-back-btn" onclick="lockVault()">◀ YOPISH</button>
            <h2 style="color:#facc15; margin:0; font-size:18px;">🔐 MAXFIY MENYU</h2>
            <div style="width: 65px;"></div>
        </div>
        <div class="hub-grid">
            <a href="https://behruz820.github.io/soccer/" target="_blank" class="hub-card ninja-game">🎮 1. Ninja Game (behruz820)</a>
            <a href="https://www.youtube.com" target="_blank" class="hub-card">📺 YouTube</a>
            <a href="https://www.google.com" target="_blank" class="hub-card">🔍 Google</a>
            <a href="https://yandex.com/games/" target="_blank" class="hub-card">🎮 Yandex Games</a>
            <a href="https://play-cs.com/" target="_blank" class="hub-card">🔫 CS 1.6 Online</a>
            <a href="https://github.com/behruz820" target="_blank" class="hub-card">💻 GitHub (behruz820)</a>
        </div>
    </div>

    <!-- SKRIPT -->
    <script>
        var displayText = "0";

        function btnClick(val) {
            var screen = document.getElementById("calcScreen");
            if (!screen) return;

            if (val === "C") {
                displayText = "0";
                screen.innerText = displayText;
                return;
            }

            if (val === "=") {
                if (displayText === "820") {
                    document.getElementById("secretHub").style.display = "flex";
                    displayText = "0";
                    screen.innerText = "0";
                    return;
                }
                try {
                    var res = eval(displayText);
                    if (res === undefined || isNaN(res)) {
                        displayText = "Xato";
                    } else {
                        displayText = String(res);
                    }
                } catch (err) {
                    displayText = "Xato";
                }
                screen.innerText = displayText;
                return;
            }

            if (displayText === "0" || displayText === "Xato") {
                displayText = val;
            } else {
                displayText = displayText + val;
            }
            screen.innerText = displayText;
        }

        function lockVault() {
            document.getElementById("secretHub").style.display = "none";
            displayText = "0";
            document.getElementById("calcScreen").innerText = "0";
        }

        window.addEventListener('keydown', function(e) {
            if ((e.key >= '0' && e.key <= '9') || e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                btnClick(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                btnClick('=');
            } else if (e.key === 'Backspace') {
                displayText = displayText.length > 1 ? displayText.slice(0, -1) : "0";
                document.getElementById("calcScreen").innerText = displayText;
            } else if (e.key.toLowerCase() === 'c') {
                btnClick('C');
            }
        });
    </script>
</body>
</html>
